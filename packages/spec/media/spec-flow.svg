<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="blackout-spec: vendor platforms emit one canonical event format, verified by conformance fixtures, consumable by any implementation under Apache-2.0.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="400" rx="14" fill="#101625"/>
  <rect x="0.5" y="0.5" width="959" height="399" rx="14" fill="none" stroke="#2a3348"/>

  <text x="36" y="52" font-size="24" font-weight="700" fill="#f2f5fa">blackout-spec</text>
  <text x="36" y="76" font-size="14" fill="#8a93a6">one wire format for tracker telemetry evidence — implement it without touching AGPL code</text>

  <!-- vendors -->
  <text x="36" y="122" font-size="12" font-weight="600" fill="#e8b64c" letter-spacing="1">ANY SOURCE</text>
  <g>
    <rect x="36" y="134" width="164" height="40" rx="8" fill="#171f33" stroke="#2a3348"/>
    <text x="118" y="159" font-size="12.5" fill="#c7cedb" text-anchor="middle">Traccar forwarder</text>
    <rect x="36" y="184" width="164" height="40" rx="8" fill="#171f33" stroke="#2a3348"/>
    <text x="118" y="209" font-size="12.5" fill="#c7cedb" text-anchor="middle">vendor platform</text>
    <rect x="36" y="234" width="164" height="40" rx="8" fill="#171f33" stroke="#2a3348"/>
    <text x="118" y="259" font-size="12.5" fill="#c7cedb" text-anchor="middle">in-house pipeline</text>
  </g>

  <path d="M208 154 C 250 154, 250 204, 288 204" stroke="#8a93a6" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M208 204 h80" stroke="#8a93a6" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M208 254 C 250 254, 250 204, 288 204" stroke="#8a93a6" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- canonical event -->
  <text x="296" y="122" font-size="12" font-weight="600" fill="#e8b64c" letter-spacing="1">THE CANONICAL EVENT</text>
  <rect x="296" y="134" width="300" height="160" rx="8" fill="#0b0f1a" stroke="#5fb8a5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#c7cedb">
    <text x="314" y="160">{ "tenant_id", "source",</text>
    <text x="314" y="180">  "event_identity": { basis, value },</text>
    <text x="314" y="200">  "received_at", "device_time",</text>
    <text x="314" y="220">  "position", "motion", "power",</text>
    <text x="314" y="240">  "network", "alerts",</text>
    <text x="314" y="260">  "quality": { raw_sha256 } }</text>
  </g>
  <text x="314" y="284" font-size="11" fill="#8a93a6">identity basis declared · missing stays missing</text>

  <path d="M604 204 h44" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- consumers -->
  <text x="656" y="122" font-size="12" font-weight="600" fill="#e8b64c" letter-spacing="1">ANY IMPLEMENTATION</text>
  <g>
    <rect x="656" y="134" width="268" height="40" rx="8" fill="#171f33" stroke="#2a3348"/>
    <text x="790" y="159" font-size="12.5" fill="#c7cedb" text-anchor="middle">Blackout Forensics engine (AGPL)</text>
    <rect x="656" y="184" width="268" height="40" rx="8" fill="#171f33" stroke="#2a3348"/>
    <text x="790" y="209" font-size="12.5" fill="#c7cedb" text-anchor="middle">your closed-source product — fine</text>
    <rect x="656" y="234" width="268" height="40" rx="8" fill="#171f33" stroke="#2a3348"/>
    <text x="790" y="259" font-size="12.5" fill="#c7cedb" text-anchor="middle">validators, analytics, archives</text>
  </g>

  <!-- conformance strip -->
  <rect x="36" y="318" width="888" height="52" rx="8" fill="#171f33" stroke="#2a3348"/>
  <text x="60" y="342" font-size="12.5" font-weight="600" fill="#5fb8a5">Conformance fixtures decide, not vibes.</text>
  <text x="60" y="360" font-size="11.5" fill="#8a93a6">JSON Schemas + fixtures for the hard cases: byte-identical resends, synthesised identity, late backfill, deep-sleep gaps · Apache-2.0 · DCO contributions</text>
</svg>
