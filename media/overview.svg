<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Blackout Forensics overview: a tracker goes silent; the engine turns the silence into evidence; a human decides; a signed report reproduces.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="960" height="460" rx="14" fill="#101625"/>
  <rect x="0.5" y="0.5" width="959" height="459" rx="14" fill="none" stroke="#2a3348"/>

  <text x="36" y="52" font-size="24" font-weight="700" fill="#f2f5fa">Blackout Forensics</text>
  <text x="36" y="76" font-size="14" fill="#8a93a6">when a financed motorcycle's tracker goes silent, silence becomes evidence — never an accusation</text>

  <!-- 1. telemetry timeline -->
  <text x="36" y="122" font-size="12" font-weight="600" fill="#e8b64c" letter-spacing="1">1 · TELEMETRY</text>
  <rect x="36" y="134" width="200" height="120" rx="8" fill="#171f33" stroke="#2a3348"/>
  <!-- report ticks then a gap -->
  <g fill="#5fb8a5">
    <rect x="52" y="170" width="5" height="18" rx="2"/>
    <rect x="64" y="166" width="5" height="22" rx="2"/>
    <rect x="76" y="172" width="5" height="16" rx="2"/>
    <rect x="88" y="168" width="5" height="20" rx="2"/>
    <rect x="100" y="171" width="5" height="17" rx="2"/>
    <rect x="112" y="167" width="5" height="21" rx="2"/>
  </g>
  <!-- the blackout -->
  <rect x="124" y="160" width="72" height="36" rx="4" fill="#0b0f1a" stroke="#e8635a" stroke-dasharray="4 3"/>
  <text x="160" y="182" font-size="11" fill="#e8635a" text-anchor="middle">blackout</text>
  <g fill="#5fb8a5">
    <rect x="203" y="169" width="5" height="19" rx="2"/>
    <rect x="215" y="171" width="5" height="17" rx="2"/>
  </g>
  <text x="52" y="222" font-size="11" fill="#8a93a6">expected sleep? coverage gap?</text>
  <text x="52" y="238" font-size="11" fill="#8a93a6">dead SIM? cut power? theft?</text>

  <path d="M244 194 h44" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2. evidence engine -->
  <text x="296" y="122" font-size="12" font-weight="600" fill="#e8b64c" letter-spacing="1">2 · EVIDENCE ENGINE</text>
  <rect x="296" y="134" width="260" height="120" rx="8" fill="#171f33" stroke="#2a3348"/>
  <g font-size="11.5" fill="#c7cedb">
    <text x="312" y="158">episode lifecycle · late data revises</text>
    <text x="312" y="178">rules: fired / didn't / <tspan fill="#e8b64c">can't-know</tspan></text>
    <text x="312" y="198">counterevidence always shown</text>
    <text x="312" y="218">peer clusters · "possible corridor"</text>
    <text x="312" y="238" fill="#8a93a6">unknown is a valid, safe outcome</text>
  </g>

  <path d="M564 194 h44" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. human decision -->
  <text x="616" y="122" font-size="12" font-weight="600" fill="#e8b64c" letter-spacing="1">3 · HUMAN DECISION</text>
  <rect x="616" y="134" width="188" height="120" rx="8" fill="#171f33" stroke="#2a3348"/>
  <g font-size="11.5" fill="#c7cedb">
    <text x="632" y="160">queue by named factors —</text>
    <text x="632" y="176" fill="#8a93a6">no hidden score</text>
    <text x="632" y="200">high impact = two people:</text>
    <text x="632" y="216">proposer <tspan fill="#e8b64c">≠</tspan> approver</text>
    <text x="632" y="238" fill="#8a93a6">machine output is advice</text>
  </g>

  <path d="M812 194 h40" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4. signed report -->
  <rect x="856" y="150" width="68" height="88" rx="8" fill="#171f33" stroke="#5fb8a5"/>
  <g font-size="10.5" fill="#c7cedb" text-anchor="middle">
    <text x="890" y="176">signed</text>
    <text x="890" y="191">report</text>
    <text x="890" y="212" fill="#5fb8a5">hashes</text>
    <text x="890" y="226" fill="#5fb8a5">reproduce</text>
  </g>

  <!-- what it can't do -->
  <rect x="36" y="286" width="888" height="66" rx="8" fill="#0b0f1a" stroke="#2a3348"/>
  <text x="60" y="313" font-size="12.5" font-weight="600" fill="#e8635a">The product has no verb for the consequential act.</text>
  <text x="60" y="334" font-size="12" fill="#8a93a6">It cannot immobilise, message, dispatch, repossess or change credit state — proven against the vocabulary, not promised.</text>

  <!-- foundations -->
  <g font-size="11.5" fill="#8a93a6">
    <text x="36" y="392">append-only receipts · row-level security per tenant · retention with tombstone evidence · every §17 acceptance item linked in release/</text>
    <text x="36" y="416">AGPL-3.0 core <tspan fill="#5fb8a5">·</tspan> Apache-2.0 interop spec (blackout-spec) <tspan fill="#5fb8a5">·</tspan> TypeScript · PostgreSQL · React Router</text>
  </g>
</svg>
